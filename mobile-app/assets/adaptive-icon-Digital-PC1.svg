<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="adaptiveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Foreground Icon -->
  <g transform="translate(512, 512)">
    <!-- Main Circle -->
    <circle cx="0" cy="0" r="200" fill="url(#adaptiveGradient)"/>
    
    <!-- Siya Logo -->
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">S</text>
    
    <!-- Delivery Truck Icon -->
    <g transform="translate(0, 80)">
      <rect x="-40" y="-20" width="50" height="25" rx="4" fill="white" opacity="0.9"/>
      <rect x="10" y="-15" width="20" height="20" rx="3" fill="white" opacity="0.9"/>
      <circle cx="-25" cy="15" r="8" fill="#1E293B"/>
      <circle cx="20" cy="15" r="8" fill="#1E293B"/>
    </g>
  </g>
</svg>