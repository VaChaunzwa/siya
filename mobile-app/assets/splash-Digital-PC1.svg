<svg width="1284" height="2778" viewBox="0 0 1284 2778" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1284" height="2778" fill="url(#bgGradient)"/>
  
  <!-- Logo Container -->
  <g transform="translate(642, 1389)">
    <!-- Main Logo Circle -->
    <circle cx="0" cy="0" r="120" fill="url(#logoGradient)" stroke="#475569" stroke-width="4"/>
    
    <!-- Siya Text Logo -->
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">SIYA</text>
    
    <!-- Subtitle -->
    <text x="0" y="180" font-family="Arial, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Portal Mobile</text>
    
    <!-- Delivery Icon -->
    <g transform="translate(0, -40)">
      <rect x="-30" y="-15" width="40" height="20" rx="3" fill="white" opacity="0.8"/>
      <rect x="10" y="-10" width="15" height="15" rx="2" fill="white" opacity="0.8"/>
      <circle cx="-20" cy="10" r="5" fill="#1E293B"/>
      <circle cx="15" cy="10" r="5" fill="#1E293B"/>
    </g>
  </g>
  
  <!-- Loading Indicator -->
  <g transform="translate(642, 1800)">
    <circle cx="-30" cy="0" r="8" fill="#8B5CF6" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="0" cy="0" r="8" fill="#8B5CF6" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="30" cy="0" r="8" fill="#8B5CF6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.2;0.4" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
</svg>